[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigno"
version = "0.1.0"
description = "Stream Delsys Trigno EMG/IMU data from the Trigno SDK server over TCP (works on macOS)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["pyqtgraph>=0.13", "PyQt6>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
trigno = "trigno.cli:main"

[tool.setuptools]
packages = ["trigno"]
