name: Trigno
options:
  bundleIdPrefix: com.supatsaetia
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  TrignoKit:
    path: TrignoKit

settings:
  base:
    # Your Apple Developer team ID (Xcode › Settings › Accounts).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Trigno:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TrignoApp
        excludes: [Info.plist]
    dependencies:
      - package: TrignoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supatsaetia.trigno
        PRODUCT_NAME: Trigno
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Trigno
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Trigno connects to the Trigno Control Utility on your local network to stream EMG and IMU data.
        # Expose Documents/Recordings in the Files app (On My iPad › Trigno).
        INFOPLIST_FILE: TrignoApp/Info.plist
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        ENABLE_PREVIEWS: YES
        # macOS sandbox: outgoing TCP to the SDK server.
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: YES
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
