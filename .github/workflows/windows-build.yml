# Builds Trigno.exe on a clean Windows runner with Python 3.8 (the Windows 7 stack), runs its
# self-test, and publishes dist\Trigno two ways:
#   - Trigno-windows.zip on the rolling "latest" release (stable URL, no GitHub login needed):
#     https://github.com/Supat/delsys-app/releases/download/latest/Trigno-windows.zip
#   - the "Trigno-windows" artifact on the run's page under Actions.
# Extract the zip into a folder and run Trigno.exe; no build PC needed.
name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "trigno/**"
      - "windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64
      - name: Build Trigno.exe and run its self-test
        shell: cmd
        run: windows\build_core.bat python
      - name: Check the bundled DLLs
        shell: cmd
        run: dir dist\Trigno\*.dll
      - uses: actions/upload-artifact@v4
        with:
          name: Trigno-windows
          path: dist/Trigno
          if-no-files-found: error
      - name: Publish Trigno-windows.zip on the "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\Trigno -DestinationPath Trigno-windows.zip
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "Trigno for Windows (latest build)" --notes "Built and self-tested automatically from the newest code on main. Download Trigno-windows.zip, extract it into a folder, and run Trigno.exe."
          }
          gh release upload latest Trigno-windows.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
